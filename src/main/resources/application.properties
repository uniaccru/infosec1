spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/functional_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.demo-user.login=${DEMO_USER_LOGIN:demo}
app.demo-user.password=${DEMO_USER_PASSWORD:demo-password}
