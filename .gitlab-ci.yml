image: gradle:8.14.1-jdk17

stages:
  - test
  - sast
  - sca

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:
  stage: test
  script:
    - gradle --no-daemon clean test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml
    paths:
      - build/reports/
    expire_in: 1 week

sast:spotbugs:
  stage: sast
  script:
    - gradle --no-daemon spotbugsMain
  artifacts:
    when: always
    paths:
      - build/reports/spotbugs/
    expire_in: 1 week

sca:dependency-check:
  stage: sca
  script:
    - |
      if [ -n "$NVD_API_KEY" ]; then
        gradle --no-daemon dependencyCheckAnalyze -Pnvd.api.key="$NVD_API_KEY"
      else
        gradle --no-daemon dependencyCheckAnalyze
      fi
  artifacts:
    when: always
    paths:
      - build/reports/dependency-check-report.html
      - build/reports/dependency-check-report.xml
    expire_in: 1 week
